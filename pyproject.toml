[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cantonvenues"
version = "0.3.0"
description = "Canton Venues SDK: the open-source Canton Algorithmic Trading Toolkit. One typed client for every Canton DEX venue."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "cantex-sdk @ git+https://github.com/caviarnine/cantex_sdk",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pillow>=10",
    "pytest",
    "pytest-asyncio",
    "ruff",
]
# the Canton Venues example: its MCP server, the venue share cards, the Arkiv log's signer
venues = [
    "eth-account>=0.13,<1",
    "mcp>=2.2,<3",
    "pillow>=10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cantonvenues"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
