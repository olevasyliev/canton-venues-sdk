# conf-version: 10
# cantonvenues.com serves the page and the JSON API; the old nip.io host is a
# permanent redirect. certbot adds the 443 blocks on the first deploy of this version.

# the contact form: a handful of messages a minute per IP is plenty
limit_req_zone $binary_remote_addr zone=venues_contact:1m rate=3r/m;
# quotes and trade checks computed on request (the MCP server's GET routes): a person or a script
# checking its fills is well under this
limit_req_zone $binary_remote_addr zone=venues_compute:1m rate=30r/m;
server {
    listen 80;
    listen [::]:80;
    server_name cantonvenues.com www.cantonvenues.com;

    root /var/www/canton-venues;
    index index.html;
    access_log /var/log/nginx/canton-venues.access.log;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location = /api/contact {
        limit_except POST { deny all; }
        limit_req zone=venues_contact burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /api/ and /api/v1/ answer with the endpoint list (site/api-index.json), so an agent that opens
    # the base URL finds every file instead of a 404
    location ~ ^/api(/v1)?/$ {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        default_type application/json;
        try_files /api/v1/index.json =404;
    }

    # the plain-text guide for agents; /docs sends a browser to the API section and anything else here
    location = /llms.txt { charset utf-8; add_header Cache-Control "no-cache"; }
    location = /docs {
        if ($http_accept ~* "text/html") { return 302 https://cantonvenues.com/#api; }
        return 302 https://cantonvenues.com/llms.txt;
    }

    # computed on request by canton-venues-mcp (mcp_server.py: /quote and /check); exact matches win
    # over the static /api/ below
    location = /api/v1/quote {
        limit_except GET { deny all; }
        limit_req zone=venues_compute burst=10 nodelay;
        limit_req_status 429;
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://127.0.0.1:8097/quote;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location = /api/v1/check {
        limit_except GET { deny all; }
        limit_req zone=venues_compute burst=10 nodelay;
        limit_req_status 429;
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://127.0.0.1:8097/check;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /api/ {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        default_type application/json;
        try_files $uri =404;
    }

    # MCP over streamable HTTP, served by canton-venues-mcp on 127.0.0.1:8097
    location = /mcp {
        # a person opening the link in a browser gets the docs, not the protocol's ping stream;
        # MCP clients ask for text/event-stream or application/json, never text/html
        if ($http_accept ~* "text/html") { return 302 https://cantonvenues.com/#api; }
        proxy_pass http://127.0.0.1:8097/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # the page changes with every deploy: browsers revalidate it (a 304 when unchanged)
    location = /index.html { add_header Cache-Control "no-cache"; }

    # a page per venue, rewritten by the collector every tick; its card.png every few ticks
    location ^~ /venues/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # the weekly card: /weekly/ and a permalink per week, redrawn by canton-venues-weekly.timer
    location ^~ /weekly/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name canton.46-225-216-13.nip.io;
    access_log /var/log/nginx/canton-venues.access.log;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://cantonvenues.com$request_uri; }
}
